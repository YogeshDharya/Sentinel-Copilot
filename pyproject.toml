[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-copilot"
version = "0.1.0"
description = "Local-first enterprise knowledge and agentic copilot"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.29,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "langchain-community>=0.3.31,<0.4",
    "langchain>=0.3.27,<0.4",
    "langchain-ollama>=0.2.3,<0.3",
    "pgvector>=0.3,<1",
    "python-dotenv>=1,<2",
    "python-multipart>=0.0.18,<1",
    "pydantic-settings>=2.6,<3",
    "pypdf>=5,<7",
    "ragas>=0.2.15,<0.3",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
